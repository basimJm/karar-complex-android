plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.alkadad.compound'
    compileSdk 36

    defaultConfig {
        applicationId "com.alkadad.compound"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            storeFile file('release-key.jks')
            storePassword 'alkadad123'
            keyAlias 'alkadad'
            keyPassword 'alkadad123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.5'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// 16KB page size alignment for Google Play compliance
// Order: package (unsigned) -> zipalign (16KB) -> apksigner (sign last)
def buildToolsDir = android.sdkDirectory.getAbsolutePath() + "/build-tools/"
def latestBuildTools = {
    def btDir = file(buildToolsDir)
    return btDir.listFiles().findAll { it.isDirectory() }.sort { it.name }.last()
}

afterEvaluate {
    // Sign the already-16KB-aligned release APK
    tasks.matching { it.name == 'packageRelease' }.configureEach {
        doLast {
            def tools = latestBuildTools()
            def zipalign = new File(tools, "zipalign")
            def apksigner = new File(tools, "apksigner")
            def apks = file("${buildDir}/outputs/apk/release").listFiles()?.findAll { it.name.endsWith(".apk") && !it.name.contains("-unsigned") }
            apks?.each { apk ->
                def aligned = new File(apk.parent, apk.name.replace(".apk", "-aligned.apk"))
                exec {
                    commandLine zipalign.absolutePath, "-f", "-P", "16", "4096", apk.absolutePath, aligned.absolutePath
                }
                exec {
                    commandLine apksigner.absolutePath, "sign",
                        "--ks", file("release-key.jks").absolutePath,
                        "--ks-pass", "pass:alkadad123",
                        "--ks-key-alias", "alkadad",
                        "--key-pass", "pass:alkadad123",
                        "--out", apk.absolutePath,
                        aligned.absolutePath
                }
                aligned.delete()
                println "16KB Aligned + Signed: ${apk.name}"
            }
        }
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    // ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    // Network
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Image Loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Accompanist
    implementation 'com.google.accompanist:accompanist-permissions:0.32.0'

    // Debug
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
